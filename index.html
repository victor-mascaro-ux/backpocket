<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Backpocket · Prototype 01 · Victor Mascaro</title>
<meta name="description" content="A prototype you can try: an expense report that fills itself in from a photo of the receipt and highlights anything it isn't sure about. By Victor Mascaro, UX/AI designer.">
<meta name="theme-color" content="#0A1430">
<meta property="og:type" content="website">
<meta property="og:title" content="Backpocket: expense reports from a photo · Prototype by Victor Mascaro">
<meta property="og:description" content="Half of workers don't file expense reports for money they're owed. Try a prototype that fills the report from a photo.">
<meta property="og:image" content="https://victor-mascaro-ux.github.io/backpocket/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="627">
<meta property="og:url" content="https://victor-mascaro-ux.github.io/backpocket/">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
:root{
  /* app (fictional Acme product) */
  --bg:#F4F4F1; --surface:#FFFFFF; --ink:#16191C; --muted:#5B6168; --line:#E2E3DF; --line-strong:#B9BCB6;
  --brand:#0E6B4E; --brand-hover:#0A583F; --brand-soft:#E6F3ED; --brand-ink:#0B4F3A;
  --flag-bg:#FFF5DB; --flag-line:#B7791F; --flag-ink:#6B4700;
  --error:#B42318; --focus:#2457D6;
  /* guide (Victor's brand) */
  --navy:#0A1430; --navy-2:#111E43; --navy-3:#13235A; --navy-line:#1E2C56; --ice:#EEF3FF; --ice-muted:#A9B6D6; --neon:#4FC3F7; --gold:#FFC83D;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,"Liberation Mono","Courier New",monospace;
  --hand:"Segoe Print","Bradley Hand","Marker Felt","Comic Sans MS",cursive;
  --s:1;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--navy);color:var(--ice);font:16px/1.5 var(--font);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tnum{font-variant-numeric:tabular-nums}

/* ================= Page layout ================= */
/* desktop: top row (name, language) · left: the context · right: steps bar above the phone */
body{overflow:auto;background:var(--navy)}
.page{display:grid;grid-template-columns:minmax(380px,680px) auto;grid-template-rows:minmax(0,1fr);grid-template-areas:"panel stage";justify-content:center;column-gap:56px;padding:20px 32px;height:100vh;height:100dvh;background:var(--navy)}
.concept :focus-visible{outline-color:var(--neon)}
.bar-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;min-width:44px;padding:0 10px;border:0;border-radius:10px;background:transparent;color:var(--ice);font-size:14px;font-weight:600;cursor:pointer}
.bar-btn:hover{background:var(--navy-3)}
.stage{grid-area:stage;position:relative;display:flex;flex-direction:column;gap:12px;width:calc(418px * var(--s));min-height:0}
.mini-av{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:#DDE7E2;color:var(--brand-ink);font-size:10px;font-weight:700}
.phone-fit{position:relative;width:calc(418px * var(--s));height:calc(872px * var(--s));flex:none}
.phone{position:absolute;left:0;top:0;width:418px;height:872px;transform:scale(var(--s));transform-origin:top left;border-radius:64px;padding:14px;background:#0B0B0D;box-shadow:inset 0 0 0 2px #2A2D35,inset 0 0 0 6px #111318,0 0 0 1px #2B3557,0 40px 90px rgba(0,0,0,.55)}
.phone::before,.phone::after{content:"";position:absolute;width:4px;border-radius:2px;background:#22252C}
.phone::before{left:-4px;top:180px;height:64px;box-shadow:0 84px 0 #22252C}
.phone::after{right:-4px;top:230px;height:100px}
.screen{position:relative;width:390px;height:844px;border-radius:50px;overflow:hidden;background:var(--bg);color:var(--ink)}
.island{position:absolute;z-index:40;top:11px;left:50%;width:124px;height:36px;margin-left:-62px;border-radius:20px;background:#000;pointer-events:none}
.statusbar{position:absolute;z-index:30;top:0;left:0;right:0;height:54px;display:flex;align-items:center;justify-content:space-between;padding:4px 30px 0 46px;font-size:16px;font-weight:600;letter-spacing:-.01em;color:#000;pointer-events:none;background:var(--bg)}
.statusbar .icons{display:flex;align-items:center;gap:6px}
.statusbar svg{display:block}
.screen.dark .statusbar{color:#fff;background:#000}
.home-ind{position:absolute;z-index:40;bottom:8px;left:50%;width:136px;height:5px;margin-left:-68px;border-radius:3px;background:#111;pointer-events:none}
.screen.dark .home-ind{background:#fff}
.scroller{position:absolute;top:54px;left:0;right:0;bottom:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;scrollbar-width:none}
.scroller::-webkit-scrollbar{display:none}
.scroller:focus-visible{outline:3px solid var(--neon);outline-offset:-3px;border-radius:0}
.screen.dark .scroller{overflow:hidden}

/* ================= Context (left) ================= */
.concept{grid-area:panel;min-height:0;overflow-y:auto;padding:20px 4px 20px 0;color:var(--ice);scrollbar-width:thin}
.concept a{color:var(--neon)}
.concept a.g-btn{color:var(--navy)}
.concept a.g-btn.ghost{color:var(--ice)}
.c-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 8px}
.c-top .c-eyebrow{margin:0}
.c-eyebrow{margin:0 0 8px;font:600 12px/1.4 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--neon)}
.c-title{margin:0 0 16px;font-size:clamp(28px,3.2vw,40px);line-height:1.12;letter-spacing:-.02em;font-weight:700}
.c-problem{margin:0 0 6px;font-size:19px;line-height:1.5}
.c-source{margin:0 0 20px;font-size:13px;color:var(--ice-muted)}
.c-why{margin:0 0 12px;font-size:16px;color:var(--ice)}
.c-try{margin:0 0 28px;padding:12px 14px;border:1px solid var(--navy-line);border-radius:12px;background:var(--navy-2);font-size:15px}
.concept h3{margin:0 0 10px;font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ice-muted)}
.c-list{margin:0 0 24px;padding:0;list-style:none;counter-reset:d}
.c-list li{position:relative;margin:0 0 10px;padding-left:34px;font-size:15px;line-height:1.5;counter-increment:d}
.c-list li::before{content:counter(d);position:absolute;left:0;top:1px;width:22px;height:22px;border-radius:6px;background:var(--navy-3);color:var(--neon);font:600 12px/22px var(--mono);text-align:center}
.c-real{margin:0 0 24px;font-size:15px;color:var(--ice)}
.c-switch{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:0 0 24px;padding:12px 14px;border:1px solid var(--navy-line);border-radius:12px}
.c-switch span{font-size:15px}
.concept .switch{background:#3A4670}
.concept .switch[aria-checked="true"]{background:var(--neon)}
.c-cta{padding:18px;border-radius:16px;background:var(--navy-3)}
.c-cta p{margin:0 0 12px;font-weight:600;font-size:17px}
.c-cta .row{display:flex;flex-wrap:wrap;gap:10px}
.c-cta .g-btn{width:auto;flex:1 1 180px}
@media (min-width:1240px){
  .c-list{display:grid;grid-template-columns:1fr 1fr;column-gap:28px}
}

/* ================= Steps bar (above the phone, like the mobile view) ================= */
.guide{position:relative;z-index:60;flex:none;color:var(--ice)}
.guide :focus-visible{outline-color:var(--neon)}
.g-compact{display:flex;align-items:center;gap:10px;min-height:56px;padding:6px 8px 6px 14px;background:var(--navy-2);border:1px solid var(--navy-line);border-radius:16px}
.g-step{flex:none;padding:3px 8px;border-radius:999px;background:var(--navy-3);color:var(--neon);font:700 12px/1.4 var(--mono)}
.g-ctitle{flex:1;min-width:0;margin:0;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-show-sm{flex:none;display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 12px;border:0;border-radius:10px;background:var(--neon);color:var(--navy);font-size:14px;font-weight:700;cursor:pointer}
.g-show-sm svg.i{display:none}
.g-show-sm[aria-disabled="true"]{opacity:.6;cursor:progress}
.g-expand{flex:none;display:grid;place-items:center;width:44px;height:44px;border:0;border-radius:10px;background:transparent;color:var(--ice);cursor:pointer}
.g-expand:hover{background:var(--navy-3)}
.g-expand svg{transition:transform .2s}
.guide.open .g-expand svg{transform:rotate(180deg)}
.g-full{display:none;position:absolute;top:calc(100% + 8px);left:0;right:0;max-height:calc(100dvh - 140px);overflow-y:auto;flex-direction:column;gap:16px;padding:18px 18px 16px;background:var(--navy);border:1px solid var(--navy-line);border-radius:16px;box-shadow:0 20px 40px rgba(0,0,0,.45);scrollbar-width:thin}
.guide.open .g-full{display:flex}
.g-full .g-head,.g-full .g-about,.g-full .g-cta{display:none}
.g-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.g-name{margin:0;font-size:20px;font-weight:700;letter-spacing:-.01em;line-height:1.25}
.g-by{display:inline-block;margin-top:2px;font-size:13px;color:var(--ice-muted);text-decoration:none}
.g-by:hover{color:var(--ice);text-decoration:underline}
.g-lang{min-width:44px;min-height:40px;padding:0 10px;border:1px solid var(--navy-line);border-radius:10px;background:transparent;color:var(--ice);font-size:13px;font-weight:700;cursor:pointer}
.g-lang:hover{background:var(--navy-3)}
.g-dashes{display:flex;gap:5px}
.g-dashes i{flex:1;height:4px;border-radius:2px;background:#24325E}
.g-dashes i.done{background:var(--neon)}
.g-dashes i.now{background:linear-gradient(90deg,var(--neon) 50%,#24325E 50%)}
.g-label{margin:0;font:600 11.5px/1.3 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ice-muted)}
.g-card{padding:18px;border-radius:16px;background:var(--navy-2);border:1px solid var(--navy-line)}
.g-chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 4px;border-radius:999px;background:var(--navy-3);font-size:12.5px;font-weight:600;color:var(--ice)}
.g-chip.ok{padding-left:10px;background:#103B33;color:#7FE0B5}
.g-chip svg.i{width:16px;height:16px}
.g-title{margin:12px 0 8px;font-size:22px;line-height:1.2;letter-spacing:-.01em}
.g-desc{margin:0 0 16px;font-size:15px;line-height:1.55;color:#CBD4EE}
.g-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:48px;padding:0 18px;border:0;border-radius:12px;background:var(--neon);color:var(--navy);font-size:16px;font-weight:700;cursor:pointer;text-decoration:none}
.g-btn:hover{filter:brightness(1.06)}
.g-btn svg.i{width:16px;height:16px;fill:currentColor}
.g-btn[aria-disabled="true"]{opacity:.6;cursor:progress}
.g-btn.ghost{background:transparent;color:var(--ice);border:1.5px solid #3E4E80}
.g-btn.ghost:hover{background:var(--navy-3)}
.g-help{margin:10px 0 0;font-size:13px;line-height:1.45;color:var(--ice-muted);text-align:center}
.g-stack{display:flex;flex-direction:column;gap:10px}
.g-about{border:1px solid var(--navy-line);border-radius:14px}
.g-about summary{display:flex;align-items:center;justify-content:space-between;min-height:48px;padding:0 14px;cursor:pointer;font-size:14px;font-weight:600;list-style:none}
.g-about summary::-webkit-details-marker{display:none}
.g-about summary svg{transition:transform .2s}
.g-about[open] summary svg{transform:rotate(180deg)}
.g-about .in{padding:0 14px 14px;font-size:14px;line-height:1.55;color:#CBD4EE}
.g-about h3{margin:14px 0 6px;font:600 11.5px/1.3 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ice-muted)}
.g-about p{margin:0 0 8px}
.g-about a{color:var(--neon)}
.g-about ol{margin:0;padding-left:18px}
.g-about li{margin-bottom:6px}
.g-foot{margin-top:auto;display:flex;flex-direction:column;gap:12px;padding-top:4px}
.g-cta{padding:14px;border-radius:14px;background:var(--navy-3)}
.g-cta p{margin:0 0 10px;font-size:14px;font-weight:600}
.g-restart{display:flex;align-items:center;justify-content:center;gap:8px;min-height:44px;border:0;background:none;color:var(--ice-muted);font-size:14px;font-weight:600;cursor:pointer}
.g-restart:hover{color:var(--ice)}

/* pulsing ring (guide layer, drawn over the phone) */
.ring{position:absolute;z-index:35;pointer-events:none;border:3px solid var(--neon);border-radius:14px;opacity:0;transition:opacity .2s;box-shadow:0 0 0 0 rgba(79,195,247,.55);animation:pulse 1.5s ease-out infinite}
.ring.on{opacity:1}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(79,195,247,.55)}100%{box-shadow:0 0 0 14px rgba(79,195,247,0)}}
.demo-press{transform:scale(.96);transition:transform .12s}

/* ================= App (fictional product) ================= */
.app{min-height:100%;display:flex;flex-direction:column}
.view{flex:1;display:flex;flex-direction:column;min-height:100%}
.content{flex:1;padding:0 16px 24px}
.app-head{display:flex;align-items:center;justify-content:space-between;padding:8px 16px 4px}
.app-brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px}
.logo{display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:var(--brand);color:#fff}
.logo svg{width:20px;height:20px}
.app-brand .name{font-weight:700;font-size:17px;letter-spacing:-.01em}
.app-brand .dot{color:var(--muted)}
.avatar-btn{display:grid;place-items:center;width:44px;height:44px;padding:0;border:0;border-radius:50%;background:transparent;cursor:pointer}
.avatar{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:#DDE7E2;color:var(--brand-ink);font-weight:600;font-size:13px}
h1.h1{margin:12px 0 2px;font-size:28px;line-height:1.2;letter-spacing:-.015em}
h1:focus{outline:none}
.sub{margin:0 0 16px;color:var(--muted);font-size:15px}
h2.h2{display:flex;align-items:center;gap:8px;margin:26px 0 4px;font-size:18px;line-height:1.3}
.count{display:inline-grid;place-items:center;min-width:24px;height:24px;padding:0 7px;border-radius:999px;background:#E7E8E4;font-size:13px;font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:0 1px 2px rgba(16,24,40,.05),0 2px 6px rgba(16,24,40,.06)}
.money-card{position:relative;padding:16px}
.eyebrow{margin:0;font-size:13px;font-weight:600;color:var(--muted)}
.big{margin:2px 0 4px;font-size:38px;line-height:1.1;font-weight:700;letter-spacing:-.02em}
.mc-meta{margin:0 0 14px;color:var(--muted);font-size:15px}
.plus{position:absolute;left:16px;top:58px;font-weight:700;color:var(--brand);font-size:18px;opacity:0;pointer-events:none}
.plus.go{animation:plus 1.4s ease-out forwards}
@keyframes plus{0%{opacity:0;transform:translate(150px,10px)}20%{opacity:1}100%{opacity:0;transform:translate(150px,-26px)}}
.status-pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--brand-soft);color:var(--brand-ink);font-size:14px;font-weight:600}
.status-pill svg.i{width:16px;height:16px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border:0;border-radius:12px;font-size:16px;font-weight:600;cursor:pointer;text-align:center;line-height:1.2;text-decoration:none}
.btn-primary{width:100%;background:var(--brand);color:#fff}
.btn-primary:hover{background:var(--brand-hover)}
.btn-primary[aria-disabled="true"]{background:#8DB5A6;cursor:progress}
.btn-secondary{width:100%;background:var(--surface);color:var(--brand-ink);border:1.5px solid var(--brand)}
.btn-secondary:hover{background:var(--brand-soft)}
.btn-sm{width:auto;min-height:44px;padding:0 14px;font-size:15px}
.btn-plain{width:100%;background:transparent;color:var(--ink);border:1.5px solid var(--line-strong)}

.list{list-style:none;margin:8px 0 0;padding:0}
.list li{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:8px}
.list li.is-new{animation:newrow 1.6s ease-out}
@keyframes newrow{0%{background:#DDF0E7;border-color:var(--brand)}100%{background:var(--surface);border-color:var(--line)}}
.cat-ic{display:grid;place-items:center;width:40px;height:40px;flex:none;border-radius:12px;background:#EEF0EC}
.li-main{flex:1;min-width:0}
.li-title{margin:0;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li-sub{margin:0;color:var(--muted);font-size:13px}
.li-end{text-align:right}
.li-amt{margin:0;font-weight:600;font-size:15px}
.li-status{display:inline-flex;align-items:center;gap:4px;margin:0;color:var(--brand-ink);font-size:13px;font-weight:600}
.li-status svg.i{width:16px;height:16px}

.app-bar{position:sticky;bottom:0;z-index:5;padding:12px 16px 40px;background:linear-gradient(to top,var(--bg) 80%,rgba(244,244,241,0))}
.bar-note{display:flex;align-items:center;justify-content:center;gap:6px;margin:0 0 8px;font-size:14px}
.bar-note.ok{color:var(--brand-ink);font-weight:600}
.bar-note.todo{color:var(--flag-ink);font-weight:600}
.bar-note svg.i{width:16px;height:16px}

.toast{position:absolute;z-index:32;left:16px;right:16px;bottom:118px;display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;background:var(--ink);color:#fff;font-size:15px;box-shadow:0 8px 24px rgba(0,0,0,.18);opacity:0;transform:translateY(8px);transition:opacity .2s,transform .2s;pointer-events:none}
.toast.show{opacity:1;transform:none}
.toast svg.i{color:#7FE0B5}

/* camera */
.camera{position:relative;height:100%;min-height:100%;background:#000;color:#fff}
.viewfinder{position:absolute;inset:0 0 150px 0;overflow:hidden;background:radial-gradient(120% 90% at 50% 45%,#8A6A4A 0%,#6B4F35 55%,#3E2C1C 100%)}
.viewfinder::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(94deg,rgba(255,255,255,.03) 0 2px,transparent 2px 22px),repeating-linear-gradient(94deg,rgba(0,0,0,.05) 0 1px,transparent 1px 9px)}
.viewfinder::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 120px rgba(0,0,0,.55);pointer-events:none}
.cam-target{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.92)}
.corners i{position:absolute;width:28px;height:28px;border:3px solid #FFD54A;z-index:3}
.corners i:nth-child(1){left:-14px;top:-14px;border-right:0;border-bottom:0;border-radius:6px 0 0 0}
.corners i:nth-child(2){right:-14px;top:-14px;border-left:0;border-bottom:0;border-radius:0 6px 0 0}
.corners i:nth-child(3){left:-14px;bottom:-14px;border-right:0;border-top:0;border-radius:0 0 0 6px}
.corners i:nth-child(4){right:-14px;bottom:-14px;border-left:0;border-top:0;border-radius:0 0 6px 0}
.cam-top{position:absolute;z-index:4;top:8px;left:8px;right:8px;display:flex;align-items:center;justify-content:space-between}
.cam-btn{display:grid;place-items:center;width:44px;height:44px;border:0;border-radius:50%;background:rgba(0,0,0,.45);color:#fff;cursor:pointer}
.cam-pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:rgba(0,0,0,.55);font-size:14px;font-weight:600}
.cam-pill .dot{width:8px;height:8px;border-radius:50%;background:#FFD54A}
.cam-bottom{position:absolute;left:0;right:0;bottom:0;height:150px;display:flex;align-items:center;justify-content:center;background:#000;padding-bottom:20px}
.shutter{width:76px;height:76px;padding:0;border:4px solid #fff;border-radius:50%;background:transparent;cursor:pointer;display:grid;place-items:center}
.shutter span{width:62px;height:62px;border-radius:50%;background:#fff;transition:transform .1s}
.shutter:active span{transform:scale(.9)}
.shutter:focus-visible{outline-color:#FFD54A;outline-offset:4px;border-radius:50%}
.cam-empty{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);margin:0;padding:8px 14px;border-radius:999px;background:rgba(0,0,0,.55);font-size:15px;font-weight:600;white-space:nowrap}

const loc = () => (state.lang === 'pt' ? 'pt-BR' : 'en-US');
function t(key, vars = {}) {
  const s = (STR[state.lang] && STR[state.lang][key]) ?? STR.en[key] ?? key;
  return s.replace(/\{(\w+)\}/g, (_, k) => (vars[k] ?? ''));
}
const money = n => new Intl.NumberFormat(loc(), { style: 'currency', currency: 'USD' }).format(n);
const moneyShort = n => new Intl.NumberFormat(loc(), { style: 'currency', currency: 'USD', minimumFractionDigits: 0, maximumFractionDigits: 0 }).format(n);

const nextSample = () => SAMPLES.find(s => !state.added.includes(s.id));
function parseMoney(str) {
  let s = String(str).replace(/[^\d.,-]/g, '');
  if (!s) return NaN;
  const lc = s.lastIndexOf(','), ld = s.lastIndexOf('.');
  if (lc > ld) s = s.replace(/\./g, '').replace(',', '.'); else s = s.replace(/,/g, '');
  const n = Number(s);
  return Number.isFinite(n) ? Math.round(n * 100) / 100 : NaN;
}
function fmtTime(ms) {
  const secs = Math.max(1, Math.round(ms / 1000));
  return secs < 60 ? t('timeSec', { s: secs }) : t('timeMin', { m: Math.floor(secs / 60), s: String(secs % 60).padStart(2, '0') });
}

/* ---------------- Receipt paper ---------------- */
function receiptHTML(s, { mark = false } = {}) {
  const rows = s.paper.map(([kind, a, b, key]) => {
    const m = mark && key && s.flag === key ? ' mark' : '';
    switch (kind) {
      case 'title': return `<p class="r-title">${a}</p>`;
      case 'small': return `<p class="r-small">${a}</p>`;
      case 'meta': return `<p class="r-meta">${a}</p>`;
      case 'rule': return '<hr class="r-rule">';
      case 'row': return `<div class="r-row"><span>${a}</span><span>${b}</span></div>`;
      case 'big': return `<div class="r-row big${m}"><span>${a}</span><span>${b}</span></div>`;
      case 'center': return `<p class="r-center">${a}</p>`;
      default: return '';
    }
  }).join('');
  return `<div class="receipt${s.worn ? ' worn' : ''}" style="--tilt:${s.tilt || '0deg'}">${rows}</div>`;
}

/* Pulsing ring: points at the next control on the phone */
function ringCandidates() {
  const task = currentTask();
  if (task === 'done') return [];
  if (state.sheet === 'confirm') return ['[data-action="confirm-send"]'];
  if (state.sheet) return [];
  if (state.view === 'home') return task === 't7' ? ['[data-action="send"]'] : ['[data-action="scan"]'];
  if (state.view === 'camera') return nextSample() ? ['[data-action="shutter"]'] : [];
  if (state.view === 'review') {
    const r = state.review, s = currentSample();
    if (!r || r.phase !== 'ready') return [];
    const list = [];
    if (s.flag && !r.resolved.total) list.push('[data-action="pick-total"][data-value="46.5"]');
    if (s.needs === 'guests' && !r.values.guests.trim()) list.push('[data-action="use-names"]');
    if (s.needs === 'reason' && !reasonDone()) list.push('#reason-conf');
    list.push('[data-action="save"]');
    return list;
  }
  return [];
}
function placeRing() {
  const ring = $('#ring'), screen = $('#screen'), scroller = $('#scroller');
  if (!ring || !screen) return;
  if (state.guideOpen) { ring.classList.remove('on'); return; }
  const sRect = screen.getBoundingClientRect();
  const scale = (sRect.width / screen.offsetWidth) || 1;
  const vis = scroller.getBoundingClientRect();
  let target = null;
  for (const sel of ringCandidates()) {
    const el = screen.querySelector(sel);
    if (!el) continue;
    const r = el.getBoundingClientRect();
    const inSheet = !!el.closest('.sheet-layer');
    const visible = r.width > 0 && (inSheet || (r.top >= vis.top - 2 && r.bottom <= vis.bottom + 2));
    if (visible) { target = { el, r }; break; }
  }
  if (!target) { ring.classList.remove('on'); return; }
  const pad = 6, { r, el } = target;
  const radius = parseFloat(getComputedStyle(el).borderRadius) || 12;
  ring.style.left = ((r.left - sRect.left) / scale - pad) + 'px';
  ring.style.top = ((r.top - sRect.top) / scale - pad) + 'px';
  ring.style.width = (r.width / scale + pad * 2) + 'px';
  ring.style.height = (r.height / scale + pad * 2) + 'px';
  ring.style.borderRadius = (Math.min(radius, r.height / scale / 2) + pad) + 'px';
  ring.classList.add('on');
}
function ringLoop() { placeRing(); requestAnimationFrame(ringLoop); }

/* "Show me": does the current task on the phone, slowly enough to follow */
async function tap(sel, { scroll = true } = {}) {
  const el = $('#screen').querySelector(sel);
  if (!el) return false;
  if (scroll && !el.closest('.sheet-layer') && !el.closest('.app-bar')) {
    el.scrollIntoView({ block: 'center', behavior: reduceMotion() ? 'auto' : 'smooth' });
    await wait(reduceMotion() ? 50 : 450);
  }
  await wait(350);
  el.classList.add('demo-press');
  await wait(140);
  el.classList.remove('demo-press');
  el.click();
  await wait(250);
  return true;
}
async function untilReady() {
  for (let i = 0; i < 60; i++) { if (state.review && state.review.phase === 'ready') return; await wait(100); }
}
async function scanFlow() {
  if (state.sheet) closeSheet();
  if (state.view === 'review' && state.review) { await untilReady(); return; }
  if (state.view === 'home') { await tap('[data-action="scan"]', { scroll: false }); await wait(450); }
  if (state.view === 'camera') { await tap('[data-action="shutter"]', { scroll: false }); }
  await untilReady();
  await wait(500);
}
async function demo() {
  if (state.demo) return;
  const task = currentTask();
  if (task === 'done') return;
  state.demo = true; state.guideOpen = false; renderGuide();
  startClock();
  try {
    switch (task) {
      case 't1': case 't3': await scanFlow(); break;
      case 't2': await untilReady(); await tap('[data-action="save"]', { scroll: false }); break;
      case 't4':
        await untilReady();
        if (!state.review.resolved.total) { await tap('[data-action="pick-total"][data-value="46.5"]'); await wait(400); }
        await tap('[data-action="save"]', { scroll: false }); break;
      case 't5':
        await scanFlow();
        if (!state.review.values.guests.trim()) { await tap('[data-action="use-names"]'); await wait(400); }
        await tap('[data-action="save"]', { scroll: false }); break;
      case 't6':
        await scanFlow();
        if (!reasonDone()) { await tap('#reason-conf'); await wait(400); }
        await tap('[data-action="save"]', { scroll: false }); break;
      case 't7':
        if (state.view !== 'home') { state.view = 'home'; state.review = null; render(); await wait(300); }
        await tap('[data-action="send"]');
        await wait(450);
        await tap('[data-action="confirm-send"]', { scroll: false }); break;
    }
  } finally {
    state.demo = false;
    renderGuide();
  }
}

    btn.setAttribute('aria-pressed', String(typed ? picked === 'typed' : Number(btn.dataset.value) === picked));
  });
  const mark = document.querySelector('.photo .mark'); if (mark) mark.classList.remove('mark');
  clearError('total');
  refreshReviewStatus();
}
function saveReview() {
  const s = currentSample(), r = state.review;
  if (!s || r.phase !== 'ready') return;
  const v = r.values, errs = [];
  if (!v.merchant.trim()) { setError('merchant', t('errMerchant')); errs.push('merchant'); }
  if (!v.date) { setError('date', t('errDate')); errs.push('date'); }
  const amt = parseMoney(v.totalText);
  if (!(amt > 0)) { setError('total', t('errAmount')); errs.push('total'); }
  else if (s.flag && !r.resolved.total) { setError('total', t('errTotal')); errs.push('total'); }
  if (s.needs === 'guests' && !v.guests.trim()) { setError('guests', t('errGuests')); errs.push('guests'); }
  if (s.needs === 'reason') {
    if (!v.reason) { setError('reason', t('errReason')); errs.push('reason'); }
    else if (v.reason === 'other' && !v.reasonOther.trim()) { setError('reason', t('errOther', { manager: MANAGER })); errs.push('reason'); }
  }
  if (errs.length) {
    const first = errs[0];
    let target;
    if (first === 'reason') target = v.reason === 'other' ? $('#f-other') : document.querySelector('input[name="reason"]');
    else if (first === 'total' && s.flag && !r.resolved.total) target = document.querySelector('[data-action="pick-total"]');
    else target = $('#f-' + first);
    const fw = $('#fw-' + first);
    if (fw) fw.scrollIntoView({ block: 'center', behavior: reduceMotion() ? 'auto' : 'smooth' });
    if (target) setTimeout(() => target.focus({ preventScroll: true }), reduceMotion() ? 0 : 300);
    announce(state.review.errors[first]);
    return;
  }
  state.ready.push({ id: s.id, merchant: v.merchant.trim(), date: v.date, total: amt, category: v.category });
  state.added.push(s.id);
  state.newId = s.id; state.lastAdded = amt;
  state.review = null; state.view = 'home';
  render(); scrollerTop(); focusHeading();
  setTimeout(() => showToast(t('saved', { amount: money(amt) })), 150);
}

/* sheets inside the phone */
let sheetOpener = null;
function openSheet(name, opener) {
  sheetOpener = opener || document.activeElement;
  state.sheet = name; renderSheet();
  const f = $('#sheet-layer .sheet button'); if (f) f.focus({ preventScroll: true });
}
function closeSheet() {
  state.sheet = null; renderSheet();
  if (sheetOpener && document.contains(sheetOpener)) sheetOpener.focus({ preventScroll: true });
}
function renderSheet() {
  const layer = $('#sheet-layer');
  if (!state.sheet) { layer.classList.remove('open'); layer.innerHTML = ''; return; }
  let body = '';
  if (state.sheet === 'confirm') {
    body = `
      <h2 id="sheet-title">${t('confirmTitle')}</h2>
      <p>${t('confirmBody', { n: state.ready.length, amount: money(total()), manager: MANAGER })}</p>
      <div class="actions">
        <button class="btn btn-primary" type="button" data-action="confirm-send">${t('confirmSend')}</button>
        <button class="btn btn-plain" type="button" data-action="close-sheet">${t('confirmKeep')}</button>
      </div>`;
  }
  layer.innerHTML = `<div class="scrim" data-action="close-sheet"></div><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title"><div class="grab" aria-hidden="true"></div>${body}</div>`;
  layer.classList.add('open');
}

/* sent */
function sendReport() {
  state.sent = { count: state.ready.length, amount: total(), ms: state.startedAt ? Date.now() - state.startedAt : null };
  state.sheet = null; state.view = 'done';
  render(); scrollerTop(); focusHeading(); announce(t('doneTitle'));
  if (state.celebrations && !reduceMotion()) burst();
}
function renderDone() {
  $('#app').innerHTML = `
    <div class="view done">
      ${appHead()}
      <div class="content done-wrap">
        <div class="confetti" id="confetti" aria-hidden="true"></div>
        <div class="done-hero">
          <div class="done-check">${icon('check')}</div>
          <h1 tabindex="-1">${t('doneTitle')}</h1>
          <p>${t('doneBody', { amount: `<strong class="tnum">${money(state.sent.amount)}</strong>`, manager: MANAGER })}</p>
        </div>
      </div>
      <div class="app-bar"><button class="btn btn-primary" type="button" data-action="done-back">${t('doneBtn')}</button></div>
    </div>`;
}
function burst() {
  const box = $('#confetti'); if (!box) return;
  const colors = ['#0E6B4E', '#18A877', '#FFC83D', '#4FC3F7', '#2457D6'];
  box.innerHTML = Array.from({ length: 22 }, (_, i) => {
    const a = (Math.PI * 2 * i) / 22 + Math.random() * 0.3, d = 70 + Math.random() * 70;
    return `<i style="background:${colors[i % colors.length]};--x:${Math.cos(a) * d}px;--y:${Math.sin(a) * d - 20}px;--r:${Math.round(Math.random() * 540)}deg;animation-delay:${Math.random() * 0.12}s"></i>`;
  }).join('');
}

/* ================= Events ================= */
document.addEventListener('click', e => {
  if (state.guideOpen && !e.target.closest('#guide')) { state.guideOpen = false; renderGuide(); }
  const el = e.target.closest('[data-action]');
  if (!el) return;
  if (el.getAttribute('aria-disabled') === 'true') return;
  const a = el.dataset.action;
  const before = currentTask();
  switch (a) {
    case 'demo': demo(); break;
    case 'guide-toggle': state.guideOpen = !state.guideOpen; renderGuide(); { const b = document.querySelector('[data-action="guide-toggle"]'); if (b) b.focus(); } break;
    case 'lang': {
      const inPanel = !!el.closest('#intro');
      state.lang = state.lang === 'en' ? 'pt' : 'en'; state.shownTotal = null; render();
      const b = document.querySelector(inPanel ? '#intro [data-action="lang"]' : '#guide [data-action="lang"]'); if (b) b.focus();
      break;
    }
    case 'restart': state = newState(state); render(); scrollerTop(); break;
    case 'scan': startClock(); state.view = 'camera'; render(); focusHeading(); break;
    case 'close-camera': state.view = 'home'; state.shownTotal = null; render(); focusHeading(); break;
    case 'shutter': shutter(); break;
    case 'discard': state.review = null; state.view = 'home'; state.shownTotal = null; render(); scrollerTop(); focusHeading(); break;
    case 'toggle-photo': {
      const r = state.review; if (!r) break;
      r.showWhole = !r.showWhole;
      document.querySelector('.photo').classList.toggle('whole', r.showWhole);
      el.setAttribute('aria-expanded', String(r.showWhole));
      el.innerHTML = icon(r.showWhole ? 'collapse' : 'expand') + (r.showWhole ? t('showLess') : t('showWhole'));
      break;
    }
    case 'pick-total': resolveTotal(Number(el.dataset.value), Number(el.dataset.value)); break;
    case 'type-total': { resolveTotal(null, 'typed'); const inp = $('#f-total'); if (inp) { inp.focus(); inp.select(); } break; }
    case 'use-names': { state.review.values.guests = CAL_NAMES; const inp = $('#f-guests'); if (inp) inp.value = CAL_NAMES; refreshReviewStatus(); break; }
    case 'save': saveReview(); break;
    case 'send': openSheet('confirm', el); break;
    case 'confirm-send': sendReport(); break;
    case 'close-sheet': closeSheet(); break;
    case 'done-back': state.view = 'home'; state.shownTotal = null; render(); scrollerTop(); focusHeading(); break;
  }
  if (!['demo', 'guide-toggle', 'lang'].includes(a) && currentTask() !== before) renderGuide();
});
document.addEventListener('input', e => {
  const r = state.review; if (!r) return;
  const el = e.target;
  switch (el.name) {
    case 'merchant': r.values.merchant = el.value; if (el.value.trim()) clearError('merchant'); break;
    case 'date': r.values.date = el.value; if (el.value) clearError('date'); break;
    case 'total': {
      r.values.totalText = el.value;
      if (currentSample().flag && !r.resolved.total) resolveTotal(null, 'typed');
      if (parseMoney(el.value) > 0) clearError('total');
      break;
    }
    case 'guests': r.values.guests = el.value; refreshReviewStatus(); break;
    case 'reasonOther': r.values.reasonOther = el.value; refreshReviewStatus(); break;
  }
});
document.addEventListener('change', e => {
  const r = state.review; if (!r) return;
  const el = e.target;
  if (el.name === 'category') r.values.category = el.value;
  if (el.name === 'reason') {
    r.values.reason = el.value;
    const w = $('#other-wrap'); if (w) w.hidden = el.value !== 'other';
    clearError('reason'); refreshReviewStatus();
  }
});
document.addEventListener('submit', e => { e.preventDefault(); if (e.target.id === 'review-form') saveReview(); });
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.tagName === 'INPUT' && e.target.closest('#review-form') && e.target.type !== 'radio') { e.preventDefault(); saveReview(); }
  if (state.sheet) {
    if (e.key === 'Escape') { e.preventDefault(); closeSheet(); }
    if (e.key === 'Tab') {
      const items = [...document.querySelectorAll('#sheet-layer .sheet button')];
      if (!items.length) return;
      const first = items[0], last = items[items.length - 1];
      if (!items.includes(document.activeElement)) { e.preventDefault(); first.focus(); }
      else if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  } else if (e.key === 'Escape' && state.guideOpen) { state.guideOpen = false; renderGuide(); }
});
document.addEventListener('toggle', e => { if (e.target.classList && e.target.classList.contains('g-about')) state.aboutOpen = e.target.open; }, true);

/* fit the phone to the window */
function fit() {
  if (isMobile()) { document.documentElement.style.setProperty('--s', 1); return; }
  const stage = $('#stage'), bar = $('#guide');
  const h = stage.clientHeight - bar.offsetHeight - 12;
  const s = Math.max(0.5, Math.min(1, h / 872));
  document.documentElement.style.setProperty('--s', s.toFixed(3));
}
window.addEventListener('resize', fit);

render();
fit();
ringLoop();
})();
</script>
</body>
